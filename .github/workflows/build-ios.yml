name: build-ios-ipa

# 微信聊天记录恢复 · iOS 版云端编译
# 不依赖 Xcode 工程文件（XcodeGen 生成的格式在新旧 Xcode 之间会不兼容），
# 直接用 swiftc 编译出 .app 包再打成 ipa。产物是【未签名】的，需要用
# Sideloadly + 你自己的 Apple ID 签名后才能装进 iPhone。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 准备源码
        run: |
          if [ -f wxcarve-ios-repo.zip ]; then
            unzip -oq wxcarve-ios-repo.zip
            echo "已解压 wxcarve-ios-repo.zip"
          fi
          echo "--- 仓库内容 ---"
          ls -R | head -40

      - name: 定位源码
        run: |
          S=$(find . -name WxCarveApp.swift -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "!! 没找到 WxCarveApp.swift"; exit 1; fi
          echo "SRC_DIR=$(dirname $S)" >> $GITHUB_ENV
          echo "源码: $S"

      - name: 编译出 .app（swiftc 直出，不用 Xcode 工程）
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          xcodebuild -version || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          rm -rf WxCarve.app Payload WxCarve-unsigned.ipa
          mkdir -p WxCarve.app
          xcrun --sdk iphoneos swiftc -parse-as-library \
            -target arm64-apple-ios16.0 -sdk "$SDK" -O \
            -module-name WxCarve \
            -o WxCarve.app/WxCarve WxCarveApp.swift
          echo "--- 编译产物 ---"
          ls -la WxCarve.app/
          file WxCarve.app/WxCarve

      - name: 写 Info.plist 并打包成 ipa
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          cat > WxCarve.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>WxCarve</string>
            <key>CFBundleIdentifier</key><string>com.wxcarve.recover</string>
            <key>CFBundleName</key><string>WxCarve</string>
            <key>CFBundleDisplayName</key><string>微信恢复</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>NSPhotoLibraryAddUsageDescription</key><string>保存恢复出来的聊天记录</string>
          </dict>
          </plist>
          PLIST
          plutil -lint WxCarve.app/Info.plist
          mkdir -p Payload
          cp -R WxCarve.app Payload/
          zip -qry WxCarve-unsigned.ipa Payload
          echo "--- ipa ---"
          ls -la WxCarve-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WxCarve-unsigned-ipa
          path: ${{ env.SRC_DIR }}/WxCarve-unsigned.ipa
